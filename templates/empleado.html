<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punto Escolar · Empleado</title>
<style>
body{margin:0;background:#F1F5F9;font-family:Inter,system-ui,sans-serif;color:#0F172A}
header{background:#fff;padding:16px 24px;border-bottom:1px solid #E2E8F0;display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:10px;background:#2563EB;color:#fff;display:grid;place-items:center}
main{max-width:900px;margin:24px auto;padding:0 16px}
.tabla{background:#fff;border-radius:16px;box-shadow:0 2px 12px #0001;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#64748B;text-align:left;padding:14px 16px}
td{padding:14px 16px;border-top:1px solid #E2E8F0}
tr:nth-child(even) td{background:#F8FAFC}
.b{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:600}
.pendiente{background:#FEF3C7;color:#92400E}.listo{background:#DCFCE7;color:#166534}.entregado{background:#E2E8F0;color:#334155}
small{color:#64748B}
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true">🖨</div><div><b>Punto Escolar</b><br><small>EMPLEADO</small></div></header>
<main>
  <h1>Lista de pedidos</h1>
  <div class="tabla">
    <table>
      <thead><tr><th>Folio</th><th>Servicio</th><th>Entrega</th><th>Estado</th></tr></thead>
      <tbody>
      {% for p in pedidos %}
        <tr>
          <td><b>#{{ p.folio }}</b><br><small>{{ p.fecha_registro.strftime('%d/%m/%Y %H:%M') }}</small></td>
          <td>{{ p.servicio|capitalize }}</td>
          <td>{{ p.tipo_entrega|upper }}</td>
          <td><span class="b {{ p.estado }}">{{ p.estado|capitalize }}</span></td>
        </tr>
      {% else %}
        <tr><td colspan="4">No hay pedidos registrados.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
